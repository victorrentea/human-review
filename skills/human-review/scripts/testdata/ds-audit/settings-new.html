<!doctype html>
<meta charset="utf-8"><title>Clinic settings</title>
<link rel="stylesheet" href="_shared.css">
<!-- The same screen after the migration: the branch moved it into the combo. That is an
     improvement, and it has to read as one rather than as another green box. -->
<h2>Clinic settings</h2>
<form id="settings">
  <div class="row pc-field">
    <label for="timezone">Time zone</label>
    <div class="control">
      <div class="pc-combo" data-ds="combo">
        <select id="timezone" name="timezone">
          <option>Europe/Bucharest</option><option>UTC</option>
        </select>
      </div>
    </div>
  </div>
</form>
