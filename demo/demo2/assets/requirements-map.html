<div class="reqmap" data-generated="semcov">
<style>
/* The Tests tab's matrix stylesheet. Lifted verbatim from the model-written fragment the
   demo PR shipped (petclinic test-pr, ticket #37), which is the layout the tab is held to;
   `semcov.py` emits it inside `.reqmap`. Additions for the scripted matrix are at the end. */
.reqmap{
  --rm-cov:linear-gradient(180deg,rgba(19,120,58,.32),rgba(19,120,58,.50));
  /* Coarse on purpose: half-green and full green were two intensities of one colour,
     and which one you were looking at only became clear beside the other. A hatch is
     a different *kind* of fill, legible on a single sentence with nothing to compare
     it to. 7px bands - fine ones read as a texture, or as a rendering artefact. */
  --rm-par:repeating-linear-gradient(135deg,rgba(19,120,58,.44) 0 7px,rgba(19,120,58,.10) 7px 14px);
  --rm-sel:rgba(19,120,58,.16);
  --rm-exe:linear-gradient(180deg,rgba(214,122,10,.26),rgba(214,122,10,.44));
  --rm-mis:linear-gradient(180deg,rgba(178,28,28,.32),rgba(178,28,28,.52));
  --rm-g-edge:rgba(19,120,58,.85);--rm-o-edge:rgba(190,105,0,.9);--rm-r-edge:rgba(168,22,22,.9);
  --rm-e2e-bg:#e8780f;--rm-e2e-fg:#fff;
  --rm-api-bg:rgba(112,58,168,.13);--rm-api-fg:rgba(92,44,142,1);
  --rm-unit-bg:rgba(20,120,120,.13);--rm-unit-fg:rgba(15,95,95,1);
  /* The band the two keys share above the two frames. Both rows claim it, so the
     ticket and the covering-tests card start on the same line whichever row is the
     taller one - and they are naturally unequal: framed 14px pills on the left, a
     line of 11.5px muted text on the right. */
  --rm-key-h:25px;   /* measured: the pill row draws 24.7px, the text row 23px */
  color:var(--fg,#1c1c1c);font-size:14px;line-height:1.62}
@media (prefers-color-scheme:dark){.reqmap{
  --rm-cov:linear-gradient(180deg,rgba(72,205,120,.22),rgba(72,205,120,.40));
  --rm-par:repeating-linear-gradient(135deg,rgba(72,205,120,.36) 0 7px,rgba(72,205,120,.07) 7px 14px);
  --rm-sel:rgba(72,205,120,.15);
  --rm-exe:linear-gradient(180deg,rgba(255,170,60,.20),rgba(255,170,60,.36));
  --rm-mis:linear-gradient(180deg,rgba(255,95,95,.24),rgba(255,95,95,.44));
  --rm-g-edge:rgba(110,225,155,.85);--rm-o-edge:rgba(255,190,110,.9);
  --rm-r-edge:rgba(255,140,140,.92);
  --rm-e2e-bg:#c2610f;--rm-e2e-fg:#fff4e6;
  --rm-api-bg:rgba(195,155,255,.16);--rm-api-fg:rgba(210,180,255,1);
  --rm-unit-bg:rgba(90,215,215,.16);--rm-unit-fg:rgba(135,228,228,1)}}
/* --- the ticket frame -------------------------------------------------------------
   Measured off github.com/victorrentea/petclinic/issues/37, not remembered: the issue
   body's own 1px --borderColor-accent-muted (#54aeff66 light, #388bfd66 dark), 6px
   radius, a header strip carrying avatar / login / "opened on", and 16px of body
   padding. Everything else is this page's tokens - GitHub's greys would read as
   pasted from another site. Deliberately absent: the last-edited disclosure, the
   Owner pill, the "..." menu and every other control, because none of them would do
   anything here. */
.reqmap{--rm-gh-edge:#54aeff66;--rm-gh-head:rgba(84,174,255,.07)}
@media (prefers-color-scheme:dark){.reqmap{
  --rm-gh-edge:#388bfd66;--rm-gh-head:rgba(56,139,253,.09)}}
/* Above the frame, the issue's own header line in GitHub's shape: the title, then the
   number beside it in grey. The number is the link out - it is the handle the issue is
   quoted by in standups and commit messages, and the page used to make you hunt for it.
   Bigger than the quoted body on purpose: this names what the branch was asked to do. */
.reqmap .rm-tktitle{margin:0 0 10px;font-size:1.75em;line-height:1.25;font-weight:600;
  color:var(--fg,#1c1c1c)}
.reqmap .rm-tknum{color:var(--muted,#6b6b6b);font-weight:400;text-decoration:none}
.reqmap .rm-tknum:hover{color:var(--link,#1a4fa0);text-decoration:underline}
.reqmap .rm-ticket{border:1px solid var(--rm-gh-edge);border-radius:6px;overflow:hidden}
.reqmap .rm-tkhead{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:13px;
  background:var(--rm-gh-head);border-bottom:1px solid var(--rm-gh-edge)}
.reqmap .rm-av{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:block}
.reqmap .rm-who{font-weight:600;color:var(--fg,#1c1c1c)}
.reqmap .rm-when{color:var(--muted,#6b6b6b)}
.reqmap .rm-src{color:var(--muted,#6b6b6b);min-width:0}
.reqmap .rm-src code{font-size:12px}
.reqmap .rm-issue{padding:16px}
.reqmap .rm-issue > :last-child{margin-bottom:0}
.reqmap *{box-sizing:border-box}
.reqmap .rm-body{display:flex;gap:20px;align-items:flex-start;position:relative}
/* The gutter is where the relation is drawn: a fan of wires leaves the ticket and turns
   into the card. It was 46px for them; it is the page's 20px gutter again (Victor, 7 Oct
   2026), and the wires bend tighter to fit (reqmap.js caps the bend at the gap). */
.reqmap .rm-wires{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:2;
  opacity:0;transition:opacity .18s ease}
.reqmap .rm-body[data-wired=yes] .rm-wires{opacity:1}
.reqmap .rm-wires path{fill:none;stroke:var(--rm-g-edge);stroke-linecap:round;
  stroke-linejoin:round}
/* The wire is the thing travelling, and is drawn a shade lighter so a fan of eight
   crossing the gutter does not read as a fence. Both of its ends are a dot on a frame -
   one per sentence on the ticket's border, one shared on the card's - so the drawing says
   "this row, those places" with two marks of the same kind. A brace tried to say more
   than that: it claimed a vertical extent, and two sentences sharing a line of prose
   overlapped into a tangle nobody could read a span out of. */
.reqmap .rm-wires .rm-wire{stroke-width:1.25;opacity:.7}
.reqmap .rm-wires .rm-dot,.reqmap .rm-wires .rm-hub{fill:var(--rm-g-edge);stroke:none}
.reqmap .rm-text{flex:1 1 auto;min-width:0;container-type:inline-size}
.reqmap .rm-issue p{margin:0 0 1.05em}
.reqmap .rm-hr{border:0;border-top:1px solid var(--line,#e2e2e2);margin:1.2em 0}
/* The ticket's own `## ` headings and numbered points. A <p> rather than a real heading:
   the page's h2/h3 own the tab furniture, and this is quoted text, not our structure. */
.reqmap .rm-issue .rm-h{margin:1.5em 0 .65em;font-weight:600;font-size:1.35em;
  line-height:1.25;color:var(--fg,#1c1c1c);padding-bottom:.3em;
  border-bottom:1px solid var(--line,#e2e2e2)}
.reqmap .rm-issue .rm-h:first-child{margin-top:0}
.reqmap .rm-issue ol{margin:0 0 1.05em;padding-left:1.9em}
.reqmap .rm-issue li{margin:0 0 .8em}
.reqmap .rm-issue li::marker{color:var(--muted,#6b6b6b);font-weight:700}
.reqmap .rm-issue li:last-child{margin-bottom:0}
.reqmap .rm-plain{color:inherit}
/* Four steps of one continuum. Hue carries the verdict (green proven, orange walked
   through, red unproven); the half-intensity green is the only intensity split, and a
   dashed underline repeats "incomplete" for anyone reading the shade wrong.
   box-decoration-break:clone gives every wrapped fragment its own padding and rounded
   corners, so a highlight that spans three lines reads as one band, not as sliced boxes. */
.reqmap .rm-f{border-radius:3px;padding:1px 3px;margin:0 -1px;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  transition:box-shadow .12s ease}
/* One declaration per state, worn by the sentence in the ticket and by the word in the
   legend below it - so the legend cannot say a colour the ticket does not use. The dashed
   underline that used to repeat "incomplete" under partial and executed is gone: the
   hatch and the orange are already a different *kind* of fill, and a second mark saying
   the same thing made two of the five states look like a different vocabulary. */
.reqmap .rm-f[data-cov=covered],.reqmap .rm-lg[data-cov=covered]{background:var(--rm-cov)}
.reqmap .rm-f[data-cov=partly],.reqmap .rm-lg[data-cov=partly]{background:var(--rm-par)}
.reqmap .rm-f[data-cov=exercised],.reqmap .rm-lg[data-cov=exercised]{background:var(--rm-exe)}
.reqmap .rm-f[data-cov=missing],.reqmap .rm-lg[data-cov=missing]{background:var(--rm-mis)}
.reqmap .rm-f:hover,.reqmap .rm-f:focus-visible{box-shadow:0 0 0 2px var(--rm-g-edge);outline:none}
.reqmap .rm-f[data-cov=missing]:hover,.reqmap .rm-f[data-cov=missing]:focus-visible,
.reqmap .rm-f[data-cov=missing][aria-current=true]{box-shadow:0 0 0 2px var(--rm-r-edge)}
.reqmap .rm-f[data-cov=exercised]:hover,.reqmap .rm-f[data-cov=exercised]:focus-visible,
.reqmap .rm-f[data-cov=exercised][aria-current=true]{box-shadow:0 0 0 2px var(--rm-o-edge)}
.reqmap .rm-f[aria-current=true]{box-shadow:0 0 0 2px var(--rm-g-edge)}
/* One chip design, used in the tab strip, the detail summary and the legend. */
.reqmap .rm-cat{display:inline-block;flex:0 0 auto;font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;
  background:var(--rm-e2e-bg);color:var(--rm-e2e-fg)}
/* End-to-end tests are the most fragile and the most important: a solid orange pill. */
.reqmap .rm-cat[data-cat=e2e]{font-weight:800}
.reqmap .rm-cat[data-cat=api]{background:var(--rm-api-bg);color:var(--rm-api-fg)}
.reqmap .rm-cat[data-cat=unit]{background:var(--rm-unit-bg);color:var(--rm-unit-fg)}
.reqmap .rm-hint{margin-top:16px;font-size:12px;color:var(--muted,#6b6b6b);min-height:1.5em}
/* One row over the ticket's frame, read before the prose rather than after it. There is
   no swatch any more: the word IS the swatch, set at the ticket's own size and wearing
   the exact fill it wears down in the prose, so matching legend to sentence is
   recognition rather than a comparison between two different surfaces - and they were
   different surfaces: the same gradient reads darker in a 15x9 chip than across a phrase,
   and the hatch for `partial` had barely two bands to show in one. It sat under the
   frame as a footer for a while, which is the wrong end: a reader meets five coloured
   sentences with nothing to say what the colours mean, and only finds out once they have
   already guessed. Spread edge to edge rather than bunched at the left, so the five words
   sit over the width of text they explain. The sentence stays on the hover.
   It shrinks along x rather than folding. `N/A` used to drop to a second row on a narrow
   column, which put the fifth badge directly over the ticket's first sentence, where it
   reads as part of the prose rather than as the key above it -- and cost the ticket a
   line of height exactly when it had least. Measured at 14px: the five words, their
   padding and the four gaps come to 30.6em plus 14px of borders, so the row fits while
   the column is wider than ~450px, and below that the font size is the one thing that
   can give. The coefficient is 100/30.6 shaved to 3.2: the 14px of border is the part
   that does not shrink with the font, and a row that overflows by 2px is the bug back
   again, so the slack goes on the safe side. `min(1em, ...)` is why this only ever shrinks: with room to spare the row
   stays at the ticket's own size instead of inflating to fill it. Padding and gap move
   to `em` so the whole row shrinks together -- left in px they would eat the width the
   smaller text just freed. The container is `.rm-text`, so the row measures itself
   against the ticket column it labels, not against the window.
   It wraps now. The five became seven (`unconfirmed`, `narrowed`) plus the label, and
   eval run 10 measured the row at 617px in a 470px column: `unconfirmed` ran under the
   card and `narrowed` - the only key to the grey-hatched sentence - was hidden behind it.
   The shrink was sized for five words and cannot hold eight at a readable size, and the
   reason for refusing a second row is gone: the build moves the legend *under* the ticket
   (`tests.py:reqmap_layout`), where a wrapped row lands on nothing. Packed from the left,
   so a short second row does not spread its two words to the far edges. */
.reqmap .rm-legend{display:flex;flex-wrap:wrap;justify-content:flex-start;
  align-items:center;gap:.35em .86em;min-height:var(--rm-key-h);margin-bottom:10px;
  padding:0 2px;font-size:min(1em,calc(3.2cqi - 0.5px));max-width:100%}
/* A thin grey frame around all five, so the row reads as five badges rather than as five
   words that happen to be coloured. `N/A` is why it is on all of them and not only on the
   filled ones: its state is *no fill*, so without an edge it is a word with nothing around
   it and the reader cannot tell it is the same kind of thing as `fully covered`. That
   one is spelled out where the other four are single words: `full` alone answers "full
   what?", and the row is read cold, before the ticket has taught anybody the vocabulary.
   The other four inherit the noun from it and stay short. */
.reqmap .rm-lg{border:1px solid var(--line,#dcdcdc);border-radius:3px;padding:0 .29em;
  cursor:help;white-space:nowrap;color:var(--fg,#1c1c1c)}
/* The word that says what the row is. Without it five framed words over a ticket are
   five things the reader has to recognise as a key before they can use it as one. Muted,
   because it is the label and the pills are the content. */
.reqmap .rm-lgt{color:var(--muted,#6b6b6b);white-space:nowrap}
/* The badge is a column, not a word in the sentence: same width for UI and API, or every
   test title starts at a different x and the list stops scanning as a list. */
.reqmap .rm-list .rm-cat{min-width:34px;text-align:center}
/* On the rows, one width for all three (Victor, 7 Oct 2026): 34px held UI and API but not
   the heavier three-letter E2E, which pushed its title right and broke the column. 4.5em
   is 45px at the pill's 10px, room for the widest with the text centred in it. */
.reqmap .rm-thead .rm-cat{display:inline-flex;justify-content:center;min-width:4.5em}
/* The same badge, inside the tooltip. The bubble is appended to <body>, outside .reqmap,
   so none of the rules above reach it and none of its variables resolve there - these are
   the dark palette's literal values, which is right in both themes because the bubble is
   dark in both. A tip that says "UI x2" in prose makes the reader translate it back into
   the badge they are already looking at. */
.tip .rm-cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;min-width:34px;
  text-align:center;vertical-align:1px;
  background:rgba(120,175,255,.20);color:rgba(160,200,255,1)}
.tip .rm-cat[data-cat=api]{background:rgba(195,155,255,.20);color:rgba(210,180,255,1)}
.tip .rm-cat[data-cat=unit]{background:rgba(90,215,215,.20);color:rgba(135,228,228,1)}
.tip .rm-n{margin:0 10px 0 5px}
.tip .rm-do{opacity:.72;font-weight:500}
/* A partial or narrowed sentence's gap, on a line of its own under the badges: the one
   sentence of the tip that is prose, so it wraps and drops to the reading weight. */
.tip .rm-gaptip{display:block;margin-top:5px;font-weight:500}
/* The right column answers the left, so it is built the same way: a title in the page's
   own voice, then a framed card under it, down to the ticket's border and 6px radius.
   Drawn full from the start: the card lists every acceptance test this branch offers,
   whether or not a sentence is selected, so the column is a thing to read rather than a
   slot waiting to be filled. Selecting a sentence marks the ones that cover it. */
.reqmap .rm-side{flex:0 0 50%;max-width:50%;min-width:0;position:sticky;top:12px}
/* Sticky is worth having while the card is a short list riding alongside a long ticket.
   It is worth nothing once a test is open: the card is then taller than the window, and a
   sticky element taller than the window pins its top and puts its own bottom permanently
   out of reach - the reader would scroll and scroll and never arrive at the end of the
   excerpt they just opened. Open one, and the column simply stands in the page. */
.reqmap .rm-side:has(.rm-t[data-open=yes]){position:static}
.reqmap .rm-code{display:flex;flex-direction:column;min-width:0;
  border:1px solid var(--rm-gh-edge);border-radius:6px;
  background:var(--card,rgba(127,127,127,.05));
  /* No height of its own, and so no scrollbar of its own. Capped at the viewport, opening
     a test put a second vertical bar a few pixels in from the window's own, and the two
     moved different things: reading forty lines of test meant scrolling the inner one
     while the page stayed put, then finding the outer one again to leave. The card grows
     to whatever it holds and the window scrolls it, which is the one bar the reader
     already knows. `hidden` is left on to keep the corners round; there is no height for
     it to clip against. Wide code still scrolls inside its own block. */
  overflow:hidden}
/* One test per row, and the row is the accordion: head always visible, source revealed
   under it. Only one open at a time - two open panes and the list stops being a list. */
.reqmap .rm-t{border-bottom:1px solid var(--line,#e2e2e2)}
.reqmap .rm-t:last-child{border-bottom:0}
.reqmap .rm-thead{display:flex;align-items:center;gap:8px;padding:7px 5px 7px 6px;cursor:pointer;
  font-size:11.5px;line-height:1.35;color:var(--muted,#6b6b6b)}
/* The card is headed the way the ticket is - one strip, an avatar's worth of icon and a
   name - because it is the ticket's counterpart, not a titled list beside it. The face
   is the robot: everything under it was read out of the code by a model. */
.reqmap .rm-code > .rm-tkhead{cursor:default}
.reqmap .rm-av-ai{width:24px;height:24px;flex:0 0 auto;display:inline-flex;
  align-items:center;justify-content:center;border-radius:50%;font-size:14px;
  background:var(--rm-gh-head);cursor:help}
.reqmap .rm-thead:hover{background:rgba(127,127,127,.07)}
.reqmap .rm-tt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
/* `.srcref` carries an 8px bottom margin for prose; in a centred row it pushed the file name 4px
   above everything else. The 1px dotted underline is balanced by 1px on top. */
/* Only the extension is shown - `.feature`, `.spec.ts`, `.java` (reqmap.js `ext`) - in the
   srcref's own link blue: the kind of test is what the row needs from its file, and the
   repo path is on the hover. It was the whole name with the extension in amber, which
   spent a third of the row on a file name nobody was reading. */
.reqmap .rm-tw{flex:0 0 auto;font-size:10.5px;margin-bottom:0;padding-top:1px}
/* One width for every extension, right-aligned: `.feature`/`.spec.ts` came out 50.6px and
   `.java` 31.6px, so the ⇥/🎭 left of it jumped 19px between rows (UX review, 7 Oct 2026).
   The dotted line is the text's own underline, not the srcref's bottom border: a border
   runs the whole 51px box, so `.java` wore a stray line in front of it (Victor, 7 Oct). */
.reqmap .rm-tw{min-width:51px;text-align:right;box-sizing:border-box}
.reqmap .rm-tw.srcref{border-bottom:0;text-decoration:underline dotted 1px;text-underline-offset:3px}
/* The open row shows the test's body and nothing above it: the file and line bar was
   noise, since the row's own extension link already opens the file (Victor, 7 Oct 2026). */
.reqmap .rm-tinner .rm-srcbar{display:none}
/* What the branch did to this test, on the test itself. It is the fact the deleted
   evidence cards carried in prose ("the new one", "the pre-existing flow, extended") -
   worth one word on the row. An untouched test used to get silence, on the theory that
   it is the ordinary case - but on a list of "every test this change set touched" a row
   with no mark reads as a gap, not as a fact, and the reader stops to ask whether the
   build forgot it. So the answer "nothing" gets a mark too: the page glyph alone, no
   badge, in the same muted grey the excerpt's own `unchanged` badge wears, and the hover
   says why the row is here at all - the test is untouched, and it is listed because it
   runs through code this branch changed. */
.reqmap .rm-cat[data-tip]{cursor:help}
.reqmap .rm-st{flex:0 0 auto;align-self:center;display:inline-flex;cursor:help;
  --st:var(--rm-g-edge)}
.reqmap .rm-st[data-st=edited]{--st:var(--rm-o-edge)}
.reqmap .rm-st[data-st=deleted]{--st:var(--rm-r-edge)}
.reqmap .rm-st[data-st=unchanged]{--st:var(--muted,#6b6b6b)}
.reqmap .rm-st svg{display:block;width:15px;height:15px;overflow:visible}
/* Two vocabularies, one alphabet. On a test row the mark stands alone - plus, pencil,
   cross - because the subject is a test; on the excerpt's badge the same mark rides the
   corner of VS Code's `new-file` page, because there the subject really is a file. Sharing
   the badges and not the page is what lets a reader learn them once. The colour carries
   the same fact a second time: green wrote it, orange changed it, red took it away. (This
   started out muted grey with only the badge coloured, which put the whole weight of the
   distinction on the smallest part of the mark and left the row reading as grey furniture.
   The words are gone either way: `NEW` in a pill was a label loud enough to be read before
   the test's own name, on a row whose subject is the test.) */
.reqmap .rm-st .rm-page,.reqmap .rm-st .rm-badge,
.reqmap .rm-fbadge .rm-page,.reqmap .rm-fbadge .rm-badge{fill:var(--st)}
/* The same glyph again, one level down: the row's stamp says what happened to the TEST,
   this says what happened to the window of code under it - a whole new file, newly
   written lines, an edit inside older lines, or nothing. `new file` / `new code` /
   `2 lines changed` / `unchanged` were four different widths of shouty caps stacked down
   the left edge of every excerpt; the reader was reading them instead of the code. The
   counts they carried are not lost - they are in the hover, and the `+` marks in the
   gutter show them line by line. */
.reqmap .rm-fbadge{display:inline-flex;flex:0 0 auto;cursor:help;--st:var(--rm-g-edge);
  margin-left:-2px}
.reqmap .rm-fbadge[data-kind=edited]{--st:var(--rm-o-edge)}
.reqmap .rm-fbadge[data-kind=unchanged]{--st:var(--muted,#6b6b6b)}
.reqmap .rm-fbadge svg{display:block;width:15px;height:15px;overflow:visible}
/* A deleted test: the name struck through the way the run struck it. It opens on its
   source as it was at the base commit (`semcov.py:base_part`); only one whose base could
   not be read is shut - no disclosure arrow, nothing to press. */
.reqmap .rm-t[data-gone=yes] .rm-tt{text-decoration:line-through;opacity:.65}
.reqmap .rm-t[data-shut=yes] .rm-thead{cursor:default}
.reqmap .rm-t[data-shut=yes] .rm-thead:hover{background:none}
.reqmap .rm-t[data-shut=yes] .rm-chev{visibility:hidden}
.reqmap .rm-chev{flex:0 0 auto;font-size:13px;opacity:1;transition:transform .15s ease}
.reqmap .rm-t[data-open=yes] .rm-chev{transform:rotate(90deg)}
.reqmap .rm-t[data-open=yes] .rm-thead{color:var(--fg,#1c1c1c);font-weight:600}
/* A selected sentence sorts the list into "these prove it" and the rest: the covering
   rows go green, everything else steps back rather than disappearing - the point of
   showing all of them is that you can see what did NOT get picked. */
.reqmap .rm-t[data-hit=yes]{background:var(--rm-sel);
  box-shadow:inset 3px 0 0 var(--rm-g-edge)}
.reqmap .rm-t[data-hit=yes] .rm-thead{color:var(--fg,#1c1c1c)}
.reqmap .rm-list[data-sel=yes] .rm-t[data-hit=no]{opacity:.42}
/* grid-template-rows 0fr -> 1fr is the one way to animate to a height nobody measured:
   the row still lays out at its natural height, the transition just gets there. `hidden`
   or display:none would snap, which is exactly what made the list jump. */
/* min-width:0 on both, or a grid item's automatic minimum size is the width of the
   widest line of code in it and the card is pushed open from the inside. */
.reqmap .rm-tbody{display:grid;grid-template-rows:0fr;min-width:0;
  transition:grid-template-rows .2s ease}
.reqmap .rm-t[data-open=yes] .rm-tbody{grid-template-rows:1fr;
  border-top:1px solid var(--line,#e2e2e2)}
.reqmap .rm-tinner{overflow:hidden;min-height:0}
/* Reading a test and asking what it pins are two different questions, and they used to be
   the same click: opening a row to read its source also lit three sentences on the ticket,
   so the outline you were left looking at was never one you asked for, and with a sentence
   already selected the two directions overlapped in the same green. Opening is now only
   opening. The relation is still many-to-many and still has to be drawable from this side,
   so it gets a control of its own - the arrowhead pointing back at the ticket - and the
   linked row wears the same green outline as the sentences it draws. */
.reqmap .rm-t[data-link=yes]{box-shadow:inset 0 0 0 1.5px var(--rm-g-edge);border-radius:4px}
.reqmap .rm-f[data-by=yes]{box-shadow:0 0 0 2px var(--rm-g-edge)}
/* It leads the row, pointing across the gap at the column it draws into - the disclosure
   arrow beside it points down into the row's own body, so the two controls say which way
   they act before they say anything else. Rendered on every row, so the badges behind it
   stay in one column, and hidden rather than merely faded on a test that pins no sentence:
   a control that would do nothing is worse than no control. */
.reqmap .rm-link{flex:0 0 auto;align-self:center;width:12px;height:14px;
  margin:0 -4px 0 0;padding:0;border:0;background:none;color:var(--muted,#6b6b6b);
  /* .8, not .5: at half strength the fan read 2.4:1 on the dark card (UX review, 7 Oct 2026) */
  opacity:.8;cursor:pointer;transition:opacity .12s ease,color .12s ease}
/* The glyph is the picture of what pressing it draws: one trunk on the right, where the
   test is, fanning into three branches reaching left at the ticket. An arrowhead only
   said "that way"; this says what will be over there. Drawn rather than borrowed from a
   font - no glyph in any stack is this, and the ones that come close (≺, ≣, ⥂) are a
   different picture at 12px. */
.reqmap .rm-fan{display:block;width:12px;height:14px;overflow:visible;
  fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.reqmap .rm-link:hover,.reqmap .rm-link:focus-visible{opacity:1;color:var(--rm-g-edge);
  outline:none}
.reqmap .rm-link[disabled]{visibility:hidden;cursor:default}
.reqmap .rm-t[data-link=yes] .rm-link{opacity:1;color:var(--rm-g-edge)}
/* Two facts in one badge: colour is the kind of test, fill is how hard it pins the
   sentence - solid asserts it, outlined only runs through it. Unselected, every badge
   is solid: there is no sentence for it to be weak about. */
.reqmap .rm-cat[data-strength=exercised]{background:transparent;
  box-shadow:inset 0 0 0 1px currentColor;opacity:.9}
.reqmap .rm-cat[data-strength=touched]{background:transparent;
  box-shadow:inset 0 0 0 1px currentColor;opacity:.6}
/* What the three badges mean, over the card the way the colour legend sits over the
   ticket. One line: the words are a reminder, not a definition, which is why they are as
   short as they are - `clicks the screen` beside a UI badge, not a sentence about it.
   Same height and same bottom margin as the colour legend (both take `--rm-key-h`), so
   the two frames under them start on one line; centred inside it, because the pills on
   the left are taller than this text and the two rows would otherwise sit at different
   heights while occupying the same band. */
.reqmap .rm-cats{display:flex;flex-wrap:wrap;align-items:center;
  min-height:var(--rm-key-h);margin:0 2px 10px;font-size:11.5px;
  color:var(--muted,#6b6b6b)}
.reqmap .rm-cats span{display:inline-flex;align-items:center}
.reqmap .rm-cats .rm-cat{margin-right:5px}
/* The three filter pills one width, the word centred: E2E, API and UNIT were 61.9, 60 and
   68.8px, a row that looked hand-placed (UX review, 7 Oct 2026). */
.reqmap .rm-cats .rm-cat{display:inline-flex;justify-content:center;min-width:70px;
  box-sizing:border-box}
.reqmap .rm-cats span+span{margin-left:14px}
/* Inference, marked where it is claimed. Everything under it was read out of the code by
   a model, and a reader who knows that reads it differently. */
.reqmap .rm-ai{font-size:.5em;vertical-align:super;margin-left:.35em;cursor:help;
  text-decoration:none}
.reqmap .rm-part{border-bottom:1px solid var(--line,#e2e2e2)}
.reqmap .rm-part:last-child{border-bottom:0}
/* One phrase in one direction, the same one every other quoted block on this page reads
   in: the file, then what changed in it. Nothing is pushed away from anything else - the
   parts are one group at the right edge. */
.reqmap .rm-srcbar{display:flex;justify-content:flex-end;align-items:center;
  gap:7px;padding:7px 12px 5px}
/* A Java test path is longer than this column is wide. `anywhere` lets it wrap, and
   wrapping *at the slashes* keeps each fragment a path segment you can still read;
   `break-word` alone would split `victor` down the middle. */
.reqmap .rm-srcbar .srcref{margin:0;font-size:10.5px;line-height:1.45;text-align:right;
  min-width:0;overflow-wrap:anywhere;word-break:break-word}
.reqmap .rm-scroll{overflow-x:auto}
/* Token colours come from the page's one Pygments stylesheet, scoped to `pre.code` - the
   same classes extract-snippet.py emits for every other snippet, light and dark, so this
   column cannot drift into a second palette. What follows is only the column's geometry,
   at a specificity that wins over `pre.code`'s; `overflow:visible` matters, or the shared
   rule's `overflow-x:auto` opens a second scroller and unsticks the file header. */
.reqmap .rm-tbody pre.code{margin:0;padding:10px 12px 10px 0;white-space:pre;font-size:12px;
  line-height:1.5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--fg,#1c1c1c);width:max-content;min-width:100%;overflow:visible;
  border-radius:0;background:var(--code-bg,var(--card,#fff))}
/* The critique of the REQUIREMENT, and so it belongs on the requirement's side: what the
   ticket asks for that nothing goes near. It used to sit under the code on the right,
   where it read as a verdict on the test you happened to be looking at. */
.reqmap .rm-gap{margin-top:12px;padding:10px 12px;border:1px solid var(--rm-o-edge);
  border-radius:6px;background:rgba(214,122,10,.07);font-size:12.5px;line-height:1.55;
  color:var(--fg,#1c1c1c)}
.reqmap .rm-gap[hidden]{display:none}
.reqmap .rm-gap h4{margin:0 0 3px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:600;color:var(--rm-o-edge)}
.reqmap .rm-gapkind{font-weight:400;opacity:.85}
/* A hole in the ticket is not a hole in the test suite, and the colour says so before

  background:rgba(150,120,235,.09)}
.reqmap .rm-gap[data-kind=requirement] h4{color:rgba(170,140,255,1)}
.reqmap .rm-gap p{margin:0}
.reqmap .rm-ln{display:inline-block;width:4.6em;padding-right:1.1em;text-align:right;

.reqmap .rm-tgroup[data-rank="5"]{opacity:.8}

   the group heading's own muted weight, so it reads as "there is more here", not as a call
   to action. */
.reqmap .rm-list[data-unfold=no] [data-fold=yes]{display:none}
.reqmap .rm-list[data-unown=no] [data-own=yes]{display:none}
.reqmap .rm-list[data-undel=no] [data-del=yes]{display:none}

// demo PR shipped (petclinic test-pr, ticket #37) when the matrix stopped being written by a
// model: `semcov.py` now draws the HTML and fills `.rm-data` itself, and this script is
// what turns that data into the card's rows, the selection, the outline and the wires.
// The only edits are marked `semcov:` - who paired a sentence (the script or a model)
// travels with each link and is said on the hover and on the blind-spot box.
(function(){
  var root=document.currentScript.closest('.reqmap');
  var D=JSON.parse(root.querySelector('.rm-data').textContent);
  var list=root.querySelector('.rm-list'),gap=root.querySelector('.rm-gap'),cur=null;
  function esc(s){return String(s).replace(/[&<>]/g,function(c){

  function where(id){return id.split('/').pop();}
  // `add-visit.component.spec.ts` -> `.spec.ts`, `OwnerListTest.java` -> `.java`: the kind
  // of test is all the row says about its file (Victor, 7 Oct 2026 - "only if it's a
  // feature or a spec.ts or a Java"). The last extension, plus the `.spec`/`.test`
  // before it where there is one; a role like `.component` or `.page` is dropped. The
  // whole repo path rides on the hover.
  function ext(file){
    var m=/((?:\.(?:spec|test|e2e-spec|e2e|cy|it))?\.[A-Za-z0-9]+)$/i.exec(file);
    return m?m[1]:file;
  }

  // Test names arrive as identifiers - `getById_exposesTheAttendingVet` - because that is
  // what the source calls them, and a column of those is read one hump at a time. A name
  // that already has spaces in it (a Gherkin scenario, a Playwright title) is a sentence
  // someone wrote and is left exactly as written; only identifiers are unpacked.
  function human(name){
    if(/\s/.test(name))return name;
    var w=name.replace(/[_\-]+/g,' ')
              .replace(/([a-z0-9])([A-Z])/g,'$1 $2')      // getById  -> get By Id
              .replace(/([A-Z]+)([A-Z][a-z])/g,'$1 $2')   // HTTPServer -> HTTP Server
              .split(/\s+/).filter(Boolean)
              // An all-caps run is an acronym and keeps its case; everything else was
              // only capitalised to mark a word boundary that is now a space.
              .map(function(x){return /^[A-Z0-9]{2,}$/.test(x)?x:x.toLowerCase();});
    return w.length?w[0].charAt(0).toUpperCase()+w[0].slice(1)+(w.length>1?' '+w.slice(1).join(' '):''):name;
  }

  // semcov: why a test is on the card comes first - paired with a sentence, written by the

  // between the two that prove the ticket.
  function rank(id){var r=D.tests[id].rank;return r===undefined?0:r;}
  // semcov: a paired test sits under the first sentence it covers, in the ticket's

  function seq(id){var q=D.tests[id].seq;return q===undefined?1e9:q;}
  function group(id){var t=D.tests[id];
    return t.sec!==undefined&&D.sections?'s'+t.sec:'r'+rank(id);}
  var ids=Object.keys(D.tests).sort(function(a,b){

      PENCIL='<path class="rm-badge" d="M8.65 13.65 13.65 8.65 15.55 10.55 10.55 15.55Z'
            +'M8.65 13.65 10.55 15.55 7.9 16.3Z"/>'
            +'<path class="rm-badge" d="M12.5 9.8 14.4 11.7 13.75 12.35 11.85 10.45Z"/>',
      // The third of the set: the plus turned 45 degrees, because it is the same fact with
      // the sign flipped - a file this branch wrote, changed, or took away.
      CROSS='<path class="rm-badge" d="M16 9.7 15.3 9 12.5 11.8 9.7 9 9 9.7 11.8 12.5'
           +' 9 15.3 9.7 16 12.5 13.2 15.3 16 16 15.3 13.2 12.5Z"/>',
      ICON='<svg viewBox="0 0 16 16" aria-hidden="true">'+PAGE,
      // A test is not a file. The row's stamp used to be the same page glyph with the same
      // badge in its cut corner - right one level down, where the subject really is a file,
      // and wrong here, where the subject is the one test named beside it. Read literally
      // it claimed the branch had added a *file*, which for one test among nine in a file
      // that already existed is simply false, and the `aria-label` said so out loud. So the
      // mark alone, and big: the same three badges blown up to fill the box the page used
      // to occupy (`2x - 16` maps the cut corner onto the whole viewBox), so a reader who
      // has learned plus/pencil/cross downstairs reads them unchanged up here. The page
      // shape stays where it belongs - on the excerpt's badge, which is about a file.
      // `2x - 17` rather than `2x - 16`: the badges are drawn in the 9..16 corner, so
      // doubling them lands 2..16 - hard against two edges and a unit off centre. The odd
      // offset puts them at 1..15, which is the middle of the box they now have to
      // themselves.
      BIG='<svg viewBox="0 0 16 16" aria-hidden="true">'
         +'<g transform="matrix(2 0 0 2 -17 -17)">',
      // [glyph, hover, name — and the name is also the `data-st` the colour hangs off,
      // so a status added here cannot end up wearing another one's badge colour.]
      STAMP={new:[BIG+PLUS+'</g></svg>','New test','new test','new'],
             changed:[BIG+PENCIL+'</g></svg>',
                      'Edited test','edited test','edited'],
             // semcov: its own lines are as they were, but it calls a helper in the same
             // file that this branch rewrote - so the run exercises different code. The
             // pencil and the edited colour (`data-st` is `edited`: it is counted with
             // them); the hover says which helper, from `t.via`.
             helper:[BIG+PENCIL+'</g></svg>',
                     'Edited via a helper',
                     'edited via helper','edited'],
             deleted:[BIG+CROSS+'</g></svg>',
                      'Deleted test','deleted test','deleted'],
             // The one state where the subject IS a file, untouched: the page glyph with no
             // badge on it, same as the excerpt badge one level down says "unchanged".
             // Not blown up like the others - there is nothing in its corner to read.
             unchanged:[ICON+'</svg>',
                        'Unchanged test','unchanged test','unchanged']};
  function stamp(t){
    // The manifest is the authority on what the branch did to a TEST; a part's own diff
    // only knows what happened inside the lines quoted, which is not the same question -
    // a test edited three lines above the excerpt reads as untouched otherwise.
    var st=STAMP[t.status]||STAMP.unchanged;
    // Copy pass (3 Oct 2026): the changed lines its coverage ran (`t.why`) went from the
    // hover; the helper's name (`t.via`) is the one detail kept.
    var tip=st[1]+(t.via?' \u2014 '+esc(t.via).replace(/"/g,'&quot;'):'');
    // The word is gone from the page but not from the accessibility tree: a screen reader
    // reading this row still gets "new test", which is what the glyph is for.
    return '<span class="rm-st" data-st="'+st[3]
      +'" role="img" aria-label="'+st[2]+'" data-tip="'+tip+'">'+st[0]+'</span>';
  }
  // semcov: proven, not inferred - the test's own per-test coverage ran a line this branch
  // changed (`t.why`: which file, which lines). IntelliJ's run-with-coverage shield: the
  // test's run covering the change. Its slot is kept on every row, empty
  // where nothing was proven, so the marks stand in one column beside the stamps.
  var ROUTE='<svg viewBox="0 0 16 16" aria-hidden="true">'
    +'<path d="M8 .9 14.2 3.2v4.6c0 3.6-2.6 6.4-6.2 7.6C4.4 14.2 1.8 11.4 1.8 7.8V3.2Z"/>'
    +'<path class="rm-play" d="M6.4 5.1v5.6l4.4-2.8Z"/></svg>';
  function ran(t){
    if(!t.why)return '<span class="rm-run" aria-hidden="true"></span>';
    return '<span class="rm-run" role="img" aria-label="runs changed code" data-tip="Runs changed code: '
      +esc(t.why).replace(/"/g,'&quot;')+'">'+ROUTE+'</span>';
  }
  // Which of the three the excerpt's own badge is. Keyed off the badge's words, not off
  // `p.diff`: `new file` and `new code` are both `diff:"new"` and are not the same fact -
  // one is a file that did not exist, the other is fresh lines inside one that did.
  function fbadge(p){
    if(!p.badge)return '';
    var kind=/^new file/.test(p.badge)?'new'
            :/^unchanged/.test(p.badge)?'unchanged':'edited',
        mark=kind==='new'?PLUS:kind==='edited'?PENCIL:'';
    // The words the badge used to print stay reachable, in front of the sentence that
    // was already on it: the glyph narrows what is said, it does not delete it.
    return '<span class="rm-fbadge" data-kind="'+kind+'" role="img" aria-label="'
      +esc(p.badge)+'" data-tip="'+esc(p.badge[0].toUpperCase()+p.badge.slice(1))
      +(p.tip?' \u2014 '+esc(p.tip).replace(/"/g,'&quot;'):'')+'">'+ICON+mark+'</svg></span>';
  }

  function partsHtml(tid){
    var t=D.tests[tid],out='';
    t.parts.forEach(function(p){
      var badge=fbadge(p);
      out+='<div class="rm-part"><div class="rm-srcbar">'
         // The name, and the path on hover - the same trade every other quoted block on
         // the page makes. A repo-relative Java path spends five segments on module,
         // `src/main/java` and the org package before it reaches the one word that
         // answers "which file is this?", which is the only question this row exists to
         // answer, and it was wrapping over three lines to say the other five.
         +(function(){
            var cut=p.label.lastIndexOf(':'),
                rel=cut<0?p.label:p.label.slice(0,cut),
                lines=cut<0?'':p.label.slice(cut),
                face=esc(rel.split('/').pop()+lines);
            // semcov: a deleted test's excerpt is its source at the base commit, so it
            // opens there (GitHub), or says how to see it - never a vscode:// into HEAD.
            var tip=esc(p.hrefTip||'Open in VS Code: '+rel).replace(/"/g,'&quot;');
            return p.href?'<a class="srcref" href="'+p.href+'" data-tip="'+tip
              +'" target="_blank" rel="noopener">'+face+'</a>'
              :'<span class="srcref" data-tip="'+tip+'">'+face+'</span>';})()
         // ...and the badge last, because `new file` is a fact ABOUT a file: leading with
         // it made the reader hold it in mind across the whole bar before the bar said
         // which file was new.
         +badge
         +'</div><div class="rm-scroll"><pre class="code'
         +(p.diff==='changed'?' diff-changed':'')+'"><code>';
      // p.html is already-escaped, Pygments-tokenised HTML - one entry per source line.
      // .ln-row / .dm and their colours come from the shared snippet stylesheet.
      p.html.forEach(function(l,i){
        var a=p.add&&p.add[i];
        out+='<span class="ln-row'+(a?' added':'')+'">'
           +(p.marks?'<span class="dm">'+(a?'+':' ')+'</span>':'')
           +'<span class="rm-ln">'+(p.from+i)+'</span>'+l+'</span>\n';});
      out+='</code></pre></div></div>';});
    return out;
  }
  var COVERS={};                       // test id -> [sentence id], inverted from D
  Object.keys(D.sentences).forEach(function(sid){
    (D.sentences[sid].groups||[]).forEach(function(g){g.tests.forEach(function(ev){
      (COVERS[ev.id]=COVERS[ev.id]||[]).push(sid);});});});

  // semcov: the "untouched and unpaired" groups (rank >= D.fold.from) start folded behind
  // one button that counts them - tests about something else that only happen to run a
  // changed line. Folded only when something stays open above them: a card of nothing but
  // pass-through tests shows them, rather than an empty card and a button. The branch's own
  // tests that ran no measured changed line (D.foldOwn, ranks from..to) fold the same way,
  // behind a count of their own: listed, never silently left out (eval run 12). The tests
  // the branch deleted (D.foldGone) fold only past a few (`F.min`): two struck-through rows
  // say more than a button that hides them.
  function mkFold(F,mark,flag){
    if(!F)return null;
    var to=F.to===undefined?Infinity:F.to,f={F:F,n:0,btn:null,mark:mark,flag:flag};
    f.has=function(id){var r=rank(id);return r>=F.from&&r<to;};
    if(ids.some(function(id){return rank(id)<F.from;}))
      ids.forEach(function(id){if(f.has(id))f.n++;});
    if(F.min&&f.n<=F.min)f.n=0;
    return f;
  }
  var FOLDS=[mkFold(D.foldOwn,'own','unown'),mkFold(D.foldGone,'del','undel'),
             mkFold(D.fold,'fold','unfold')]
    .filter(function(f){return f&&f.n>0;});
  function foldOf(id){
    for(var i=0;i<FOLDS.length;i++)if(FOLDS[i].has(id))return FOLDS[i];return null;}
  function setFold(f,open){
    list.dataset[f.flag]=open?'yes':'no';
    f.btn.setAttribute('aria-expanded',open?'true':'false');
    f.btn.textContent=f.n+' '+(f.n===1?f.F.label.replace(/^more tests/,'more test'):f.F.label)
      +' \u2014 '+(open?'hide':'show');
  }
  var lastRank=null;
  ids.forEach(function(id){
    var f=foldOf(id);
    if(f&&!f.btn){
      f.btn=document.createElement('button');
      f.btn.type='button';f.btn.className='rm-fold';f.btn.dataset.which=f.mark;
      list.appendChild(f.btn);setFold(f,false);
    }
    if(groupsShown&&group(id)!==lastRank){
      lastRank=group(id);
      var g=document.createElement('div');
      g.className='rm-tgroup';g.dataset.rank=rank(id);
      if(f)g.dataset[f.mark]='yes';
      g.textContent=lastRank.charAt(0)==='s'?D.sections[lastRank.slice(1)]
                                            :D.ranks[String(rank(id))]||'';
      if(lastRank.charAt(0)==='s')g.dataset.sec='yes';
      list.appendChild(g);
    }
    var t=D.tests[id],row=document.createElement('div');
    row.className='rm-t';row.dataset.open='no';row.dataset.id=id;
    if(f)row.dataset[f.mark]='yes';
    // A test the branch deleted is listed struck through. semcov: it opens on its source
    // as it was at the base commit; only one whose base could not be read stays shut.
    if(t.status==='deleted')row.dataset.gone='yes';
    if(t.status==='deleted'&&!t.parts.length)row.dataset.shut='yes';
    // The location is a link in its own right, not decoration on a button: the row opens
    // the source here, the link opens the file in the editor, and both are wanted.
    var pins=(COVERS[id]||[]).length;
    row.innerHTML='<div class="rm-thead" role="button" tabindex="0" aria-expanded="false">'
      // The other direction, asked for rather than thrown in: this draws the sentences the
      // test pins, and nothing else on the row does.
      +'<button class="rm-link" type="button" aria-pressed="false"'
      +(pins?'':' disabled')
      +(pins?' data-tip="Show the '+pins+' sentence'+(pins===1?'':'s')+' it covers"':'')
      +' aria-label="outline the sentences this test pins">'
      +'<svg class="rm-fan" viewBox="0 0 12 14" aria-hidden="true">'
      +'<path d="M7 7H11.2"/><path d="M7 7H1.2"/>'
      +'<path d="M7 7C4.6 7 4.6 1.7 1.2 1.7"/>'
      +'<path d="M7 7C4.6 7 4.6 12.3 1.2 12.3"/></svg></button>'
      +'<span class="rm-cat" data-cat="'+t.cat+'">'+esc(D.cats[t.cat])+'</span>'
      // The arrow leads the title rather than closing the row: it is the control, and a
      // control at the far right of a variable-width row is a control nobody finds.
      +'<span class="rm-chev">&#9654;</span>'
      +'<span class="rm-tt">'+esc(human(t.title))+'</span>'
      // The link lands on the test's own declaration, not on the first line of the
      // window quoted around it - a window often opens on the context above the test.
      +(function(){
         // Where it lived. A link while there is something to open; a deleted test has no
         // file left in this checkout, and a dead vscode:// URL is the one thing this page
         // never emits, so it keeps the location and loses the link.
         var href=t.href||(t.parts&&t.parts[0]&&t.parts[0].href),
             face=esc(ext((t.where||where(id)).replace(/:\d+(?:[-\u2013]\d+)?$/,''))),
             // The id is the repo path and line (`@base` marks a deleted test's key).
             path=esc(id.replace(/@base$/,'')).replace(/"/g,'&quot;')+' \u2014 ';
         // semcov: a deleted test's href is its blob at the base commit, and says so.
         return href?'<a class="rm-tw srcref" href="'+href+'" data-tip="'+path+esc(t.hrefTip||'Open in VS Code')+'" target="_blank" rel="noopener">'
                     +face+'</a>'
                   :'<span class="rm-tw srcref tgone" data-tip="'+path
                     +esc(t.goneTip||'the file is gone').replace(/"/g,'&quot;')+'">'
                     +face+'</span>';})()
      // The stamp closes the row, on the right of the file it is about - the same order
      // the source bar inside the row reads in, and the same reason: "new" is a fact ABOUT
      // a file, so it comes after the file has been named. Between the title and the
      // location it sat between two things that belong together and was read as part of
      // the sentence naming the test.
      +ran(t)+stamp(t)+'</div>'
      +'<div class="rm-tbody"><div class="rm-tinner"></div></div>';
    // Not a button if there is nothing to press: a row that cannot open should not tell a
    // screen reader that it expands, nor take a tab stop to do nothing with.
    if(row.dataset.shut==='yes'){
      var h=row.querySelector('.rm-thead');
      h.removeAttribute('role');h.removeAttribute('tabindex');
      h.removeAttribute('aria-expanded');
    }
    list.appendChild(row);
  });

  function outline(id){
    Array.prototype.forEach.call(root.querySelectorAll('.rm-f[data-by]'),function(f){
      f.removeAttribute('data-by');});
    (COVERS[id]||[]).forEach(function(sid){
      var f=root.querySelector('.rm-f[data-s="'+sid+'"]');
      if(f)f.setAttribute('data-by','yes');});
    wired=id;redraw();
  }

  // ---- the wires -------------------------------------------------------------------
  // An outline says WHICH sentences a test pins; on a ticket four screens long it never
  // says which of them belong together, and with the card sticky the row that pinned them
  // is usually nowhere near any of them. So the relation is drawn: one wire per sentence,
  // from a dot on the ticket's own border across the gutter to the row it came from.
  // Geometry only - nothing here decides anything, it redraws what `outline` already
  // decided, from wherever the two columns currently happen to be.
  var wrap=root.querySelector('.rm-body'),
      ticket=root.querySelector('.rm-ticket'),
      sideCol=root.querySelector('.rm-side'),
      card=root.querySelector('.rm-code'),
      svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),
      wired=null,pending=false;
  svg.setAttribute('class','rm-wires');svg.setAttribute('aria-hidden','true');
  wrap.appendChild(svg);

  // Each column scrolls on its own (tests.py REQMAP_CSS) - under its header strip, which
  // stays put: what scrolls is the ticket's prose (`.rm-issue`) and the card's list
  // (`.rm-list`), not the column. A click on one side brings the other side's matches into
  // view: as many of them as fit, the first at the top. Nothing moves when they are all
  // on screen already, or when nothing in the column scrolls (stacked, under 900px, the
  // page scrolls both).
  var textCol=root.querySelector('.rm-text');
  function scroller(pane){
    if(!pane)return null;
    var c=[pane].concat(Array.prototype.slice.call(pane.querySelectorAll('.rm-issue,.rm-list')));
    for(var i=0;i<c.length;i++)
      if(c[i].scrollHeight>c[i].clientHeight+1&&/auto|scroll/.test(getComputedStyle(c[i]).overflowY))
        return c[i];
    return null;
  }
  // The part of a column a reader can see things in: its scroller, or the column itself.
  function view(pane){var sc=scroller(pane);return (sc||pane).getBoundingClientRect();}
  function bringIn(pane,els){
    els=els.filter(function(e){return e&&e.getClientRects().length;});
    var sc=scroller(pane);
    if(!sc||!els.length)return;
    var p=sc.getBoundingClientRect(),top=Infinity,inView=true;
    els.forEach(function(e){var r=e.getBoundingClientRect();
      top=Math.min(top,r.top);if(r.top<p.top||r.bottom>p.bottom)inView=false;});
    if(!inView)sc.scrollBy({top:top-p.top-8,behavior:'smooth'});
  }

  function draw(){
    var row=wired&&list.querySelector('.rm-t[data-link=yes]');
    if(!row){svg.textContent='';wrap.dataset.wired='no';return;}
    var base=wrap.getBoundingClientRect(),t=ticket.getBoundingClientRect(),
        sd=sideCol.getBoundingClientRect(),c=card.getBoundingClientRect();
    // Under 900px the two columns stack, one above the other. There is no gutter to draw
    // in and no left-to-right relation to draw; the outline carries it alone.
    if(sd.left<t.right+8){svg.textContent='';wrap.dataset.wired='no';return;}
    var x0=t.right-base.left,ax=sd.left-base.left,
        // The row's TITLE, not the row: an open row is its header plus however many
        // screens of source it quotes, and the middle of that is somewhere down in the
        // code. The wire has to hang off the name of the test, which is the part that
        // stays put and the part the reader is looking at.
        r=row.querySelector('.rm-thead').getBoundingClientRect(),
        // The card scrolls inside itself, so the row can be above or below what it shows.
        // The wire then lands on the card's edge at the point the row left it, which is
        // the direction the reader has to scroll.
        sv=view(sideCol),
        ay=Math.min(Math.max((r.top+r.bottom)/2,Math.max(c.top,sv.top)+8),
                    Math.min(c.bottom,sv.bottom)-8)-base.top,d='';
    (COVERS[wired]||[]).forEach(function(sid){
      var f=root.querySelector('.rm-f[data-s="'+sid+'"]');if(!f)return;
      // A sentence that wraps is several rectangles, and the wire leaves from the middle
      // of all of them together - the middle of the block of text, not of its last line.
      var rects=f.getClientRects(),top=Infinity,bot=-Infinity;
      if(!rects.length)return;
      Array.prototype.forEach.call(rects,function(k){
        top=Math.min(top,k.top);bot=Math.max(bot,k.bottom);});
      // The wire lands on the ticket's own border, on the line the sentence sits on, and
      // the dot is what makes that a landing rather than a line running out of page.
      // The ticket scrolls inside its column too: a sentence above or below what it shows
      // gets its wire on the column's edge, the way the card's rows do.
      var tc=textCol?view(textCol):t,
          mid=Math.min(Math.max((top+bot)/2,tc.top+8),tc.bottom-8)-base.top,
          // The bend grows with the drop, but never past the gutter: a control point
          // further out than the gap is wide pulls the curve backwards mid-way, over the
          // card it is leaving - in a 20px gutter any drop over ~125px did that.
          dx=Math.min(Math.max(12,Math.abs(ay-mid)*0.16),Math.max(4,(ax-x0)*0.9));
      d+='<path class="rm-wire" d="M'+x0+' '+mid+'C'+(x0+dx)+' '+mid+' '
        +(ax-dx)+' '+ay+' '+ax+' '+ay+'"/>'
        +'<circle class="rm-dot" cx="'+x0+'" cy="'+mid+'" r="3"/>';
    });
    svg.innerHTML=d?d+'<circle class="rm-hub" cx="'+ax+'" cy="'+ay+'" r="3"/>':'';
    wrap.dataset.wired=d?'yes':'no';
  }

  // Every redraw is a full remeasure, and the things that move the endpoints are the page
  // scrolling, the card scrolling inside itself, the window resizing and a row opening.
  // One frame's worth of coalescing keeps that off the scroll path.
  function redraw(){
    if(pending)return;pending=true;
    requestAnimationFrame(function(){pending=false;draw();});
  }
  addEventListener('scroll',redraw,true);   // capture: the card's own scroll does not bubble
  addEventListener('resize',redraw);
  if(window.ResizeObserver)new ResizeObserver(redraw).observe(wrap);
  // The accordion animates its height, so the rows under it are still moving after the
  // click: follow them to where they land.
  list.addEventListener('transitionend',redraw);
  function toggle(row){
    if(row.dataset.shut==='yes')return;   // there is no source to show
    var open=row.dataset.open==='yes';
    // An accordion, not a stack: opening one closes the rest, so the list never turns
    // into three screens of source with the row you wanted somewhere in the middle.
    Array.prototype.forEach.call(list.querySelectorAll('.rm-t'),function(o){
      o.dataset.open='no';
      o.querySelector('.rm-thead').setAttribute('aria-expanded','false');});
    if(open){redraw();return;}
    var body=row.querySelector('.rm-tinner');
    if(!body.innerHTML)body.innerHTML=partsHtml(row.dataset.id);
    row.dataset.open='yes';
    row.querySelector('.rm-thead').setAttribute('aria-expanded','true');
    redraw();
  }

  // The other direction, drawn on demand: which sentences does THIS test pin. One row at a
  // time - two rows outlining into the same paragraph and the outline stops meaning
  // anything - and it releases the sentence selection first, because "these tests cover
  // that sentence" and "that test pins these sentences" are two different relations and
  // showing both in the same green leaves the reader working out which is which.
  function link(row){
    var on=row.dataset.link==='yes';
    clearSel();
    Array.prototype.forEach.call(list.querySelectorAll('.rm-t'),function(o){
      o.dataset.link='no';
      o.querySelector('.rm-link').setAttribute('aria-pressed','false');});
    if(on){outline(null);return;}
    row.dataset.link='yes';
    row.querySelector('.rm-link').setAttribute('aria-pressed','true');
    outline(row.dataset.id);
    bringIn(textCol,(COVERS[row.dataset.id]||[]).map(function(sid){
      return root.querySelector('.rm-f[data-s="'+sid+'"]');}));
  }

  // Everything the sentence -> tests direction put on the page, taken back off it.
  function clearSel(){
    if(cur){cur.removeAttribute('aria-current');cur=null;}
    delete list.dataset.sel;
    Array.prototype.forEach.call(list.querySelectorAll('.rm-t'),function(row){
      delete row.dataset.hit;
      var b=row.querySelector('.rm-cat');if(b)delete b.dataset.strength;
      row.querySelector('.rm-thead').removeAttribute('data-tip');});
    gap.innerHTML='';gap.hidden=true;rejMark(null);
  }
  list.addEventListener('click',function(e){
    var fb=e.target.closest('.rm-fold');                // semcov: show/hide the folded rest
    if(fb){FOLDS.forEach(function(f){if(f.btn===fb)setFold(f,list.dataset[f.flag]!=='yes');});
      redraw();return;}
    var l=e.target.closest('.rm-link');                 // draws, never opens
    if(l){link(l.closest('.rm-t'));return;}
    if(e.target.closest('.rm-tw'))return;              // the editor link is not a toggle
    var h=e.target.closest('.rm-thead');if(h)toggle(h.parentNode);});
  list.addEventListener('keydown',function(e){
    // A <button> already fires its own click on Enter and Space; letting the row's handler
    // see the key as well would open the source at the same time.
    if(e.target.closest&&e.target.closest('.rm-link'))return;
    var h=e.target.closest&&e.target.closest('.rm-thead');
    if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(h.parentNode);}});

  // semcov: the decision a narrowed sentence rests on, named and linked where it was
  // recorded (`proposal.md:86`) - "Recorded: <the whole line>" left the reader to find it.
  function recorded(s){
    if(!s.decisionWhere)return 'Recorded: '+esc(s.decision);
    var w=s.decisionHref?'<a class="srcref" href="'+esc(s.decisionHref).replace(/"/g,'&quot;')
      +'" data-tip="Open in VS Code" target="_blank" rel="noopener">'+esc(s.decisionWhere)+'</a>'
      :esc(s.decisionWhere);
    return 'Recorded in '+w+': '+esc(s.decisionQuote||s.decision);
  }
  // semcov: the links a model read and turned down. They were a second box under the
  // blind spot, and on a short screen that box ate the ticket the reader was selecting
  // from (Victor, 8 Oct 2026: "it obscures the vision"). Now one "!" at the end of the
  // colour legend, there only when the selected sentence has any; the list is its tip.
  function rejMark(rej){
    var lg=root.querySelector('.rm-legend');if(!lg)return;
    var b=lg.querySelector('.rm-rejmark');
    if(!rej||!rej.length){if(b)b.hidden=true;return;}
    if(!b){b=document.createElement('button');b.type='button';b.className='rm-rejmark';
      b.textContent='!';lg.appendChild(b);}
    b.setAttribute('aria-label',rej.length+' keyword matches rejected by AI');
    b.setAttribute('data-tip-html','<p class="tipfoot">Matched on words, rejected by 🤖</p>'
      +'<ul class="tiplist prose">'+rej.map(function(r){
        return '<li><code>'+esc(where(r.id))+'</code> \u2014 '+esc(r.why)+'</li>';}).join('')+'</ul>');
    b.hidden=false;
  }
  function open(sid){
    var s=D.sentences[sid];if(!s)return;
    // Clicking the sentence you already picked puts the ticket back the way it was. There
    // was no way out of a selection except by making another one, so the column stayed
    // sorted into "these prove it" and a dimmed rest long after the reader had finished
    // asking - and the dimming is the page's answer to a question, not its resting state.
    if(cur&&cur.dataset.s===sid){clearSel();return;}
    if(cur)cur.removeAttribute('aria-current');
    cur=root.querySelector('.rm-f[data-s="'+sid+'"]');cur.setAttribute('aria-current','true');
    // Which of the nine cover this sentence, and how hard each one pins it.
    var hit={};
    (s.groups||[]).forEach(function(g){g.tests.forEach(function(ev){
      hit[ev.id]={cat:g.cat,strength:ev.strength,why:ev.why,by:ev.by};});});
    list.dataset.sel='yes';outline(null);
    Array.prototype.forEach.call(list.querySelectorAll('.rm-t'),function(row){
      var h=hit[row.dataset.id],b=row.querySelector('.rm-cat');
      row.dataset.hit=h?'yes':'no';
      row.dataset.link='no';
      row.querySelector('.rm-link').setAttribute('aria-pressed','false');
      row.dataset.open='no';
      row.querySelector('.rm-thead').setAttribute('aria-expanded','false');
      if(h){b.dataset.strength=h.strength;row.querySelector('.rm-thead')
        .setAttribute('data-tip',(h.by==='model'?'\uD83E\uDD16 ':'')+h.strength+' — '+(h.why||''));}
      else{delete b.dataset.strength;row.querySelector('.rm-thead').removeAttribute('data-tip');}
    });
    // A gap is a criticism of the REQUIREMENT, so it is shown beside the requirement.
    // "Blind spot" alone left the reader asking whose fault it is - the tests', for not
    // reaching a claim the ticket makes, or the ticket's, for never making the claim.
    // The two are different findings and go to different people.
    var kind=s.gapKind==='requirement'?'in the requirement':'in the tests';
    gap.dataset.kind=s.gapKind||'tests';
    var head=s.cov==='narrowed'?'Narrowed on purpose':'Blind spot';
    gap.innerHTML=s.gap?'<h4>'+head+' <span class="rm-gapkind">'+kind+'</span>'
      +(s.by==='model'?'<sup class="rm-ai" data-tip="as inferred by AI">🤖</sup>':'')+'</h4><p>'+esc(s.gap)+'</p>'
      +(s.decision?'<p class="rm-dec">'+recorded(s)+'</p>':''):'';
    gap.hidden=!s.gap;
    rejMark(s.rejected);
    bringIn(sideCol,Array.prototype.filter.call(list.querySelectorAll('.rm-t[data-hit=yes]'),
      function(r){return r.dataset.catoff!=='yes';}));
  }
  root.addEventListener('click',function(e){
    var f=e.target.closest('.rm-f');if(f&&root.contains(f))open(f.dataset.s);});
  root.addEventListener('keydown',function(e){
    var f=e.target.closest&&e.target.closest('.rm-f');
    if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(f.dataset.s);}});

  // The hover on a sentence shows the badges themselves, not their names in prose, so
  // the tip and the list on the right are visibly the same two concepts - then says what
  // clicking will do, because nothing else on the page announces that.
  Array.prototype.forEach.call(root.querySelectorAll('.rm-f[data-s]'),function(f){
    var s=D.sentences[f.dataset.s];if(!s)return;
    var tip=(s.groups||[]).map(function(g){
      return '<span class="rm-cat" data-cat="'+g.cat+'">'+esc(D.cats[g.cat])
        +'</span><span class="rm-n">\u00D7'+g.tests.length+'</span>';}).join('');
    tip=tip?tip
           :'<span class="rm-do">no test \u00B7 click for what is missing</span>';
    // semcov: who paired it, after the badges - the script's evidence or a model's reading.
    tip+=s.cov==='unmapped'?'<span class="rm-do"> not paired yet \u00B7 run the 🤖</span>'
        :s.cov==='unconfirmed'?'<span class="rm-do"> \u00B7 unconfirmed \u00B7 run the 🤖</span>'
        :s.cov==='narrowed'?'<span class="rm-do"> \u00B7 narrowed by '
          +(s.decisionName?esc(s.decisionName):'a recorded decision')+'</span>'
        :'<span class="rm-do"> \u00B7 '+(s.by==='model'?'🤖 checked by AI':'paired by script')+'</span>';
    // What a partial or narrowed sentence lacks, in the matching pass's own words (its
    // `gap`): the hatch says "not all of it", and only the hover can say which part
    // without a click (Victor, 5 Oct 2026).
    if((s.cov==='partly'||s.cov==='narrowed')&&s.gap)
      tip+='<span class="rm-gaptip">'+esc(s.gap)+'</span>';
    f.setAttribute('data-tip-html',tip);
    f.removeAttribute('data-tip');
  });
})();
</script>
</div>
