"message" data-entity-1="part2" data-entity-2="part1" id="msg72"><polygon fill="#D40000" points="49.9165,2491.6836,39.9165,2495.6836,49.9165,2499.6836,45.9165,2495.6836" style="stroke:#D40000;stroke-width:1;"/><line style="stroke:#D40000;stroke-width:1;stroke-dasharray:2,2;" x1="43.9165" x2="168.7031" y1="2495.6836" y2="2495.6836"/><text fill="#D40000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.6606" x="55.9165" y="2490.9414">200</text><a href="genseq://0c10zdp" target="_top" title="Click for this call&#8217;s JSON body" xlink:actuate="onRequest" xlink:href="genseq://0c10zdp" xlink:show="new" xlink:title="Click for this call&#8217;s JSON body" xlink:type="simple"><text fill="#1A4FA0" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.4072" x="84.6904" y="2490.9414">&#8853;</text></a></g><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="306.5039" x="289.5574" y="2829.6523">@generate_sequence &#8212; generated from real traces, do not edit</text><rect fill="#DDDDDD" height="290.3008" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="721.5254" x="152.0933" y="2516.6836"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="483.5674" x="157.0933" y="2535.2188">&#9888;&#65039;  GENERATED FILE &#8212; DO NOT EDIT. Every edit is lost on the next run.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="577.8623" x="157.0933" y="2551.707">Drawn from real Tempo traces of src/owner-search.feature, for the scenarios tagged</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="494.9287" x="157.0933" y="2568.1953">@generate_sequence. Change the test, not this file, then regenerate with</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.1689" x="157.0933" y="2584.6836">petclinic-test/run-tests-with-tracing.sh</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="467.2158" x="157.0933" y="2601.1719">This picture is deliberately simplified. In review/review.html, click an</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="426.1729" x="157.0933" y="2617.6602">arrow (or its &#8853;) to reveal that one call's SQL / JSON payloads &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="454.1318" x="157.0933" y="2634.1484">a DB arrow twice, for the statement and then for the bound values.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="533.8457" x="157.0933" y="2650.6367">Detail shown here: simplified &#183; click an arrow to reveal its SQL / JSON payloads</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="510.8291" x="157.0933" y="2667.125">Want more or less? The traces already carry all of it &#8212; re-rendering replays</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.1982" x="157.0933" y="2683.6133">the spans cached in test-results/trace-spans.json (~1s): nothing has to run,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="490.4648" x="157.0933" y="2700.1016">not even Grafana (GENSEQ_REFRESH=1 re-fetches from Tempo instead):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.9404" x="174.812" y="2716.5898">cd petclinic-test</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="465.2813" x="174.812" y="2733.0781">npm run diagram:reveal  # simplified, click to reveal SQL + payloads</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.5293" x="174.812" y="2749.5664">npm run diagram:lean    # baked in: call flow only</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="395.9717" x="174.812" y="2766.0547">npm run diagram:static  # baked in: + the SQL statements</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="541.126" x="174.812" y="2782.543">npm run diagram:full    # baked in: + bound parameter values + JSON payloads</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="693.8066" x="174.812" y="2799.0313">SEQ_SQL=off|statement|values SEQ_HTTP_BODIES=0|1 SEQ_INTERACTIVE=0|1 npm run trace:diagram</text><?plantuml-src pLhDSjl84RxhARhA1qjPYGGe_iWiKuubGIjjQQMOPE9AsIxL41W0Gm83Q6O84eoJsdCkkII7tLDEUONTSnx5Bv1NICyGL2Y9jhJ9fcfu8JYOwVdwww-xySEO1HJ2B5EZRBub9updH90KuZAd8c5yybiUc0ESH199Dqqvpf9Cm3FtTVFqjREbc4eeIE7NincdOazI8lou5bAYfe9kwQseW5z754yIHQyblPbIxbFuzDrVOJKQG2Yo50Gb2IX1V2ft8SY0PmfemDGM8b3CPpdX2ev4DfDKt1qZ_eJouCxOoT5MhmSlVOss--oawU3dyAKy7COK0XgIQQAWO7G6J8B2iP09gK1H3iOHH909v0AnZKhW9AKlw_BmPTtOEuHURokX23y0mQ9ORG5y-k7l__hfBm1VUvTU__NGEu7JymlFk7bo1PTNG_1EpeSry0egIkEMtZd9SDEC6mISpXM8AQ-XjHD1PdoDbI5DywpY1hBmiuJlOd25iIPzoebW6Nf7eeW6QFHX56fm71CUKRD2KQbs3UagHcWXIz0Sdk08ORKIPap5Q2gdoaSnC7zFhweZQdCWz_JvFOsJyQWczTIXDfOpNyFJBWSqOIDZB2b1iZHFMCXeK8DplP4EINtvLOjLckm2xkDFW70qHGG67xRHGwOaVFhpttP0PNgH4KvCD9KKV98apoKCtbn07RuPN5r2Jiea8u7KqT1cK1oLBJLZ_Zff2c6b5EL3CBJ6zzMfKJR5eO8aKofDXAWYB04POnWWHg5qrvo1V_vuYtkrqorGZNq3EBJvLWitpP0dt3IXKhu2BTSgx2H1AGGb-YTGGUYa5WBAI4jCq3r1TUuYxVWZJqYf3HgVC1qaBl9ZnCMu2JDEbfW0icvCxvafjR548Mx_oPKxNQs2M9kAYJJ8ftmNpPc4B92KhmK92IUmZMeVU6-k-zvftnkSzLmD94Hjn8ZNg7SfNCQbGkmxNJIYFtvmJq7LECzJlHS4Z4HOTBeLO_1iZTkL8lv3g2RpgtKUDvbAA8O2jAaHcHWckaOf42OOdOmdvMSMQaqm_-x2hmopUjzRnNnktt2AUy3zvKircSfATO5SwWfFt9U4_cY6SQzU5eOVR_VxM2tH9y-6mzzS7rsTd7k3dlFHDMFdbqEiGyV3yzzvPco5oqIyMw7RqXLiMSWsLCk1AIrQ1ZghjPGncAg4X63HqYKH4eOvhoM1WZJbQBr0LfKQzWvN1RgBrN48TPApPV6IMyHNhD1