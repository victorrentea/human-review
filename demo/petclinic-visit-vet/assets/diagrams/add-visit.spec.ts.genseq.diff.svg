9165,3426.7578" style="stroke:#D40000;stroke-width:1;"/><line style="stroke:#D40000;stroke-width:1;stroke-dasharray:2,2;" x1="43.9165" x2="376.2969" y1="3426.7578" y2="3426.7578"/><text fill="#D40000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.6606" x="55.9165" y="3422.0156">200</text><a href="genseq://0x0g655" target="_top" title="Click for this call&#8217;s JSON body" xlink:actuate="onRequest" xlink:href="genseq://0x0g655" xlink:show="new" xlink:title="Click for this call&#8217;s JSON body" xlink:type="simple"><text fill="#1A4FA0" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.4072" x="84.6904" y="3422.0156">&#8853;</text></a></g><text fill="#888888" font-family="sans-serif" font-size="10" lengthAdjust="spacing" textLength="306.5039" x="453.9902" y="3760.7266">@generate_sequence &#8212; generated from real traces, do not edit</text><rect fill="#DDDDDD" height="290.3008" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="721.5254" x="480.959" y="3447.7578"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="483.5674" x="485.959" y="3466.293">&#9888;&#65039;  GENERATED FILE &#8212; DO NOT EDIT. Every edit is lost on the next run.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="544.6602" x="485.959" y="3482.7813">Drawn from real Tempo traces of src/add-visit.spec.ts, for the scenarios tagged</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="494.9287" x="485.959" y="3499.2695">@generate_sequence. Change the test, not this file, then regenerate with</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.1689" x="485.959" y="3515.7578">petclinic-test/run-tests-with-tracing.sh</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="467.2158" x="485.959" y="3532.2461">This picture is deliberately simplified. In review/review.html, click an</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="426.1729" x="485.959" y="3548.7344">arrow (or its &#8853;) to reveal that one call's SQL / JSON payloads &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="454.1318" x="485.959" y="3565.2227">a DB arrow twice, for the statement and then for the bound values.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="533.8457" x="485.959" y="3581.7109">Detail shown here: simplified &#183; click an arrow to reveal its SQL / JSON payloads</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="510.8291" x="485.959" y="3598.1992">Want more or less? The traces already carry all of it &#8212; re-rendering replays</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.1982" x="485.959" y="3614.6875">the spans cached in test-results/trace-spans.json (~1s): nothing has to run,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="490.4648" x="485.959" y="3631.1758">not even Grafana (GENSEQ_REFRESH=1 re-fetches from Tempo instead):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="110.9404" x="503.6777" y="3647.6641">cd petclinic-test</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="465.2813" x="503.6777" y="3664.1523">npm run diagram:reveal  # simplified, click to reveal SQL + payloads</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.5293" x="503.6777" y="3680.6406">npm run diagram:lean    # baked in: call flow only</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="395.9717" x="503.6777" y="3697.1289">npm run diagram:static  # baked in: + the SQL statements</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="541.126" x="503.6777" y="3713.6172">npm run diagram:full    # baked in: + bound parameter values + JSON payloads</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="693.8066" x="503.6777" y="3730.1055">SEQ_SQL=off|statement|values SEQ_HTTP_BODIES=0|1 SEQ_INTERACTIVE=0|1 npm run trace:diagram</text><?plantuml-src xLdBKXj75DthAswL5u5OJmn-g10EeC78HP2DPBnmN5HhkaVJrgXdFDqIZ1yfhxF99baagwpo2yawdy8Fv1TokpKZZq201CA6b5GK6lLqt-Uvv_PCkvmoS7nVjVoZZEnm4P2GTC6D0XPwN7HU26ekS1Bn91itPTFt_13kbDQNjzQB6SMLnq26Te5GckjpoLLU1ipEAvdHUbW8txMPO25Hx42ojpqcR0R7dtw1P9I24_fT21dnG8N4PZ8Br0VXAs2KgmogLzpc0H4ADaB_KB9mT8pO7IReo5Xr8-CnL40Xv6rNPG2EV__Ztxz_1dXYxLfxwqsh2bkr7SiOKgt3Rhq9LhNMp8FLPs5a50ENuFbIWIz0kGm4Er8GzaGUfLL3SYXITZTPD_1Zwy5tniSZYu4FZIXfCq52xajGfDrc52MU3b8UDbqYsioiK4ogh8c9Sj4kXtiigsy8r9-iX4EkN1GLC6LZehYTqwiAQBAva3bzFwUDvAATbtfgKmiBkArw8TF-KkRnbX7cHI1vD_2umndDGqqhwdDsM1XyvLtLzRA0UkmE486YI8YvWGNqa2i9np_zkWZArujCNbsYuyZ09fxtZOJ6ynqemDD6VHS24da-eLAdGel1tCMor26tMIfe2itgCimkmRmQtvDRBR-7GttYzPWqwM6AS0-awsEMN1QoSieP-EUleTs9fg6XslOnng7CbnfNNH_ZX4ez9kLZZ1vBSauyn06DqByGuODEQXGWXZI-GfOBcQuh33l-23mIQO769qIhn4MsYtPnOTACasNFKx9WHEVCbFmRYIXS-B4a5yiQ1QuMvH9fBE-9B8epzTB7e3m9YKC4WGM4UiDwVh1dRUrPZUrAIHlY83PSjDT0Tu1QBgH2snVBA4H_R7e2GV6u2BfQ5r1EsaW8vJXYS2SLsmGHdmEgWtat7STneZo6gG0jgaKw9X9bWnHmFCoEBxpeZ8KQ4zmUNNZNH5Rh7IBcBBrE3tN0oUK3D1dMOvg_1hZ26oSXeJywmgYhuZlEXw6-3_4IVNExsNnsi56lrgn6fVYXPCPgkqqaeSrcRTyoOubT9kFbsBgCfgy1YsKg5LYd58l348eEBmQC7N6fD10mNOE4QiSHycWp7LH0G90_AfLCp9kGUtMdkbp4p-krX3VBi6fhHY_7TzQUM4qea80N-ap9rOAvkPOXjk9zJJ89tSRV4udSPsgF1JwQxeTHtk62hdlUR4HlQxuIUlNp7ZBtT4Ah6wVaDQmTQxFvkGBWrIlC079okL0e2cSfMl7VRngCd-AbB90suUDPwQDcnDUlX-PHTYMlco6IWfRWYxpjTxjSJISvjvQqqbEYbuh5jCybqMql-QC-Sscgy_ZJRt9G4osVHfDucA0mvTWGRHXnMNYF_slqupdPIorzTWfL6r6D