server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Both kinds of snapshot are served by one image definition. A full review is
    # review.html; a screenshot gallery published by publish-demo-shots.sh, and the demo/
    # landing page above them, are index.html. Naming review.html first means a directory
    # holding both still opens on the live page rather than on the gallery.
    index review.html index.html;

    # Deliberately no catch-all rewrite. The review page deep-links into the reviewed
    # application with root-relative URLs — /owners/4, /vets — and this container holds no
    # application, so those 404. Answering them with the review page instead would be
    # friendlier and would also hide a genuinely missing asset behind a page of HTML, which
    # is the one failure the zip job already goes out of its way to warn about. A 404 here
    # is also exactly what Pages returns for the same link, and the whole point of the
    # image is to stand where Pages stands.
}
