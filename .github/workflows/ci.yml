name: tests

# The tests in this repository were, for a while, documentation: nothing ran them. They are
# load-bearing now in a way they were not then — the runbook used to carry its own
# invariants as prose a reader was trusted to follow, and those invariants are code here
# (the gate refuses before it wipes; a step whose prerequisite fails is never stamped; a
# step that raises is still closed), so the tests are the only thing holding them.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the scripts import at module level
        run: python -m pip install --quiet -r requirements-dev.txt

      # `ast-grep-cli` puts both `ast-grep` and its short alias `sg` on PATH. On Ubuntu
      # `/usr/bin/sg` (set-group-id, from `passwd`) already owns that name, so this asserts
      # the wheel's binary is the one that answers — if PATH order ever puts the system one
      # first, the failure belongs here and not in 60 confusing "no logging found" tests.
      - name: ast-grep on PATH is ast-grep
        run: ast-grep --version
      - name: Run the differ and script tests
        run: python -m pytest -q skills/human-review/puml-diff skills/human-review/scripts

      # Every script has to at least import and answer --help. A syntax error in one of them
      # otherwise surfaces halfway through somebody's review run, after the expensive steps.
      - name: Every script is importable and self-describing
        run: |
          set -e
          for s in skills/human-review/scripts/*.py; do
            case "$(basename "$s")" in test_*) continue ;; esac
            echo "--- $s"
            python "$s" --help > /dev/null
          done

      - name: Shell scripts parse
        run: |
          set -e
          for s in skills/human-review/scripts/*.sh; do
            echo "--- $s"
            bash -n "$s"
          done
